<div id="oyu-world">
  <div class="viz-row oyu-heading">
    <h2>Ою әлемі</h2>
    <span class="text-small text-muted">Қазақы футуризм</span>
  </div>
  <canvas class="cursor-interaction" role="img" aria-label="Қозғалысқа жауап беретін, қошқармүйізден шабыт алған жарық өрнек. Жарқырату батырмасымен де әрекеттесуге болады."></canvas>
  <div class="viz-row oyu-actions">
    <button type="button" class="btn btn-primary" data-burst>Жарқырату</button>
    <button type="button" class="btn" data-motion aria-pressed="true">Қозғалыс: қосулы</button>
    <span class="sr-only" aria-live="polite" data-status></span>
  </div>
</div>
<style>
  #oyu-world { width: 100%; }
  #oyu-world .oyu-heading { justify-content: space-between; }
  #oyu-world canvas { display: block; width: 100%; height: clamp(290px, 61vw, 450px); touch-action: pan-y; }
  #oyu-world .oyu-actions { justify-content: center; margin-top: 12px; }
</style>
<script>
(() => {
  const root = document.getElementById('oyu-world');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const burstButton = root.querySelector('[data-burst]');
  const motionButton = root.querySelector('[data-motion]');
  const status = root.querySelector('[data-status]');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let moving = !reduced.matches, w = 0, h = 0, phase = 0, last = 0, frame = 0;
  let pointer = { x: 0, y: 0 }, aim = { x: 0, y: 0 }, bloom = 0;
  let ripples = [], particles = [], count = 0;
  const colors = {};
  const probe = document.createElement('span');
  probe.hidden = true;
  root.appendChild(probe);
  function readColors() {
    for (const [key, token] of Object.entries({ ink: '--foreground', line: '--border', blue: '--blue', gold: '--orange', purple: '--purple' })) {
      probe.style.color = `var(${token})`;
      colors[key] = getComputedStyle(probe).color;
    }
  }
  function controls() {
    motionButton.textContent = moving ? 'Қозғалыс: қосулы' : 'Қозғалыс: өшірулі';
    motionButton.setAttribute('aria-pressed', String(moving));
  }
  function restore(state) {
    if (typeof state?.privateContent?.moving === 'boolean') moving = state.privateContent.moving && !reduced.matches;
    controls();
  }
  function save() {
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { design: 'Қазақы футуризм — Ою әлемі', motion: moving }, privateContent: { moving } }).catch(() => {});
  }
  function size() {
    const box = canvas.getBoundingClientRect();
    w = box.width; h = box.height;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    readColors(); render();
  }
  function stroke(color, width, alpha, glow = 0) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha;
    ctx.shadowColor = color; ctx.shadowBlur = glow; ctx.stroke(); ctx.shadowBlur = 0;
  }
  function horn(radius, angle, side, t) {
    ctx.save(); ctx.rotate(angle); ctx.scale(side, 1);
    const s = radius;
    ctx.beginPath();
    ctx.moveTo(0, s * .13);
    ctx.bezierCurveTo(s * .12, s * .38, s * .50, s * .35, s * .43, s * .70);
    ctx.bezierCurveTo(s * .38, s * .98, s * .05, s * .94, s * .11, s * .70);
    ctx.bezierCurveTo(s * .16, s * .53, s * .35, s * .61, s * .28, s * .73);
    stroke(colors.blue, 1.7, .85, 8 + bloom * 8);
    ctx.beginPath();
    ctx.moveTo(0, s * .22);
    ctx.bezierCurveTo(s * .18, s * .43, s * .48, s * .40, s * .37, s * .72);
    stroke(colors.gold, .8, .65, 3);
    const k = .72 + Math.sin(t + angle * 2) * .08;
    ctx.beginPath(); ctx.arc(s * .15, s * k, 2, 0, Math.PI * 2);
    ctx.fillStyle = colors.gold; ctx.globalAlpha = .8; ctx.fill();
    ctx.restore();
  }
  function render() {
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2 + pointer.x * 12, cy = h / 2 + pointer.y * 10;
    const radius = Math.min(w, h) * .38 * (1 + bloom * .05);
    ctx.save(); ctx.translate(cx, cy);
    const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 1.4);
    halo.addColorStop(0, colors.blue); halo.addColorStop(1, 'transparent');
    ctx.globalAlpha = .09 + bloom * .07; ctx.fillStyle = halo;
    ctx.fillRect(-cx, -cy, w, h);
    for (let i = 0; i < 90; i++) {
      const a = i * 2.399963 + phase * .025;
      const r = Math.sqrt((i + 1) / 90) * radius * 1.37;
      ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, i % 7 === 0 ? 1.5 : .7, 0, Math.PI * 2);
      ctx.fillStyle = i % 7 === 0 ? colors.gold : colors.ink;
      ctx.globalAlpha = .12 + .18 * (1 + Math.sin(phase + i)) / 2; ctx.fill();
    }
    ctx.rotate(phase * .065 + pointer.x * .08);
    for (const scale of [1.06, 1.16]) {
      ctx.beginPath(); ctx.arc(0, 0, radius * scale, 0, Math.PI * 2); stroke(colors.line, .8, .8);
    }
    for (let i = 0; i < 48; i++) {
      const a = i * Math.PI / 24;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * radius * 1.09, Math.sin(a) * radius * 1.09);
      ctx.lineTo(Math.cos(a) * radius * (i % 4 === 0 ? 1.15 : 1.12), Math.sin(a) * radius * (i % 4 === 0 ? 1.15 : 1.12));
      stroke(i % 4 === 0 ? colors.gold : colors.line, 1, .65);
    }
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      horn(radius, a, 1, phase); horn(radius, a, -1, phase);
    }
    ctx.rotate(-phase * .14);
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const a = i * Math.PI / 8, r = radius * (i % 2 ? .12 : .24);
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath(); stroke(colors.gold, 1.6, .95, 12);
    ctx.beginPath(); ctx.arc(0, 0, radius * .055, 0, Math.PI * 2); stroke(colors.blue, 2, .9, 10);
    ctx.restore();
    for (const r of ripples) {
      ctx.beginPath(); ctx.arc(r.x, r.y, 5 + r.age * 150, 0, Math.PI * 2);
      stroke(colors.blue, 1.3, Math.max(0, 1 - r.age / 1.6), 4);
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.age / 1.6); ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function tick(now) {
    const dt = Math.min((now - (last || now)) / 1000, .04); last = now;
    if (moving) phase += dt;
    pointer.x += (aim.x - pointer.x) * .07; pointer.y += (aim.y - pointer.y) * .07;
    bloom *= Math.exp(-dt * 2.4);
    for (const r of ripples) r.age += dt;
    for (const p of particles) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .98; p.vy *= .98; }
    ripples = ripples.filter(r => r.age < 1.6); particles = particles.filter(p => p.age < 1.6);
    render(); frame = 0;
    if (!document.hidden && (moving || ripples.length || Math.abs(aim.x - pointer.x) > .001 || Math.abs(aim.y - pointer.y) > .001)) start();
  }
  function start() { if (!frame) { frame = requestAnimationFrame(tick); } }
  function burst(x, y) {
    count++; status.textContent = `Жарық толқыны: ${count}`;
    if (reduced.matches) { phase += .9; render(); return; }
    bloom = 1; ripples.push({ x, y, age: 0 }); ripples = ripples.slice(-8);
    for (let i = 0; i < 38; i++) {
      const a = i * Math.PI * 2 / 38, speed = 35 + Math.random() * 90;
      particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, age: 0, size: .8 + Math.random() * 1.6, color: i % 3 ? colors.blue : colors.gold });
    }
    particles = particles.slice(-300); start();
  }
  canvas.addEventListener('pointermove', e => {
    if (reduced.matches) return;
    const r = canvas.getBoundingClientRect();
    aim = { x: (e.clientX - r.left) / w * 2 - 1, y: (e.clientY - r.top) / h * 2 - 1 }; start();
  });
  canvas.addEventListener('pointerleave', () => { aim = { x: 0, y: 0 }; start(); });
  canvas.addEventListener('pointerdown', e => { const r = canvas.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top); });
  burstButton.addEventListener('click', () => burst(w / 2, h / 2));
  motionButton.addEventListener('click', () => { moving = !moving; controls(); save(); start(); });
  window.addEventListener('openai:set_globals', e => { if (e.detail?.globals?.widgetState) { restore(e.detail.globals.widgetState); start(); } });
  reduced.addEventListener('change', () => { if (reduced.matches) { moving = false; controls(); } start(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { last = 0; start(); } });
  new MutationObserver(() => { readColors(); render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'style', 'data-theme'] });
  restore(window.openai?.widgetState);
  new ResizeObserver(size).observe(canvas);
  size(); start();
})();
</script>
